{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#172c33">
  <title>CYOA · Adventure</title>
  <link rel="icon" href="/favicon.ico">
  {% for stylesheet in frontend_styles %}<link rel="stylesheet" href="{{ stylesheet }}">{% endfor %}
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript to play.</noscript>
  <script src="{% static 'js/recorder.js' %}"></script>
  {% if frontend_dev %}
  <script type="module">
    import RefreshRuntime from '/frontend/@react-refresh';
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>
  <script type="module" src="/frontend/@vite/client"></script>
  <script type="module" src="/frontend/src/main.tsx"></script>
  {% else %}
  <script type="module" src="{{ frontend_script }}"></script>
  {% endif %}
</body>
</html>
