{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#172c33">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var root = document.documentElement;
      root.classList.toggle('dark', dark);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <title>CYOA · Adventure</title>
  <link rel="icon" href="/favicon.ico?v=signpost" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="{% static 'icons/favicon-96x96.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=signpost">
  <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CYOA">
  {% for stylesheet in frontend_styles %}<link rel="stylesheet" href="{{ stylesheet }}">{% endfor %}
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript to play.</noscript>
  <script src="{% static 'js/recorder.js' %}"></script>
  {% if frontend_dev %}
  <script type="module">
    import RefreshRuntime from '/frontend/@react-refresh';
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>
  <script type="module" src="/frontend/@vite/client"></script>
  <script type="module" src="/frontend/src/main.tsx"></script>
  {% else %}
  <script type="module" src="{{ frontend_script }}"></script>
  {% endif %}
  {% if not frontend_dev %}
  <script>
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
          .catch(function (error) { console.error('Service worker registration failed:', error); });
      });
    }
  </script>
  {% endif %}
</body>
</html>
