name: llm-cyoa-dev
services:
  web:
    build: ./cyoa-game-server
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,testserver
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      CLOUDFLARE_AUTH_ENABLED: 'false'
      FRONTEND_DEV: '1'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_API_URL: ${WHISPER_API_URL:-http://host.docker.internal:10300/v1/audio/transcriptions}
    volumes:
      - ./cyoa-game-server:/app
      - ./cyoa_prompts:/story_prompts:ro
      - dev-db:/app/db
      - dev-media:/app/media
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/session')"]
      interval: 10s
      timeout: 3s
      retries: 6
  frontend:
    image: node:24-alpine
    working_dir: /frontend
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
  gateway:
    image: nginx:alpine
    ports: ['127.0.0.1:8001:80']
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  dev-db:
  dev-media:
  frontend-modules:
